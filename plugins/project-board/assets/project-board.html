/* src/ui/inboxops.js */
const { summarizeSections, planOps, applyProposal } = (() => {
// 受信箱の依頼の「変更の操作（ops）」の計画と適用。HTML と CLI（tools/inbox.js）が共有する。受ける操作は addTask と moveDue だけ（PROPOSE_OPS）。
// 計画（planOps）は、操作を作業用のコピーに当てて、変更案の表・警告を作る。データは変えない。
// 適用（applyProposal）は、いまのデータで同じ手順をもう一度計算して、提案の表と同じときだけ、変更履歴を足して返す。
// 当てる順: addTask（前のタスクは足し終えてから結ぶ）→ moveDue（書かれた順）。次のタスクの動きは computeImpact の規則に合わせる。






const max = (a, b) => (a > b ? a : b);

/** 依頼で受ける操作（PROPOSE_OPS）だけを通す。保存済みの提案に残る古い操作も、ここで止める */
function checkOps(ops) {
  if (!Array.isArray(ops) || !ops.length) throw new Error("操作がありません");
  for (const o of ops) if (!PROPOSE_OPS.includes(o?.op)) throw new Error(`この操作は依頼では受けられません: ${o?.op}（画面で行ってください）`);
}

function simulate(data, ops, today) {
  checkOps(ops);

  const before = new Map(data.tasks.map((t) => [t.id, t]));
  let w = data;
  const T = (id) => w.tasks.find((t) => t.id === id);
  const need = (id) => { const t = T(id); if (!t) throw new Error(`タスク ${id} がありません`); return t; };

  const refs = new Map();       // ref → 追加したタスクの ID
  const touched = new Set();    // 操作が触る既存のタスク
  const changed = new Set();    // 期限が動いたタスク（動いた順）
  const reasons = new Map();    // タスク ID → 期限が動いた理由
  const warnings = [];
  const moves = [];
  const inboxIds = new Set();   // source: inbox の記録に載せるタスク
  let addCount = 0;

  const setDue = (id, due, reason) => {
    const start = w.tasks.find((x) => x.id === id)?.start;
    const patch = { due };
    // 画面で指定した開始日より前へ期限が動くなら、開始日を外す（外すと、前のタスクから決まる開始日に戻る）。そのままだと保存の検査で失敗する
    if (start && start > due) { patch.start = null; warnings.push(`${id} は期限が開始日 ${start} より前になるので、開始日を外します（前のタスクがあれば、前のタスクから決まります）`); }
    w = updateTask(w, id, patch, today);
    changed.add(id);
    reasons.set(id, reason);
  };
  /** id の期限を minDue 以上にする。動いたら、次のタスクも前のタスクの新しい期限を超えないように連鎖させる */
  const raise = (id, minDue, reason, group) => {
    const t = need(id);
    if (isClosed(t) || t.due >= minDue) return;
    setDue(id, minDue, reason);
    group.add(id);
    for (const s of w.tasks.filter((x) => (x.predecessors ?? []).includes(id))) raise(s.id, minDue, `前のタスク ${id} の遅れ`, group);
  };
  const resolve = (token) => refs.get(token) ?? token;

  // ① addTask（まず全部足し、前のタスクは、足し終えてから結ぶ。ref で別の addTask を指せるように）
  // businessDays 指定の期限は、前のタスク（既存のタスク、または別の addTask の ref）が決まってから計算する。ops の書く順には依存しない
  const adds = ops.filter((o) => o.op === "addTask");
  const dueOf = new Map(); // ref → 計算した期限（businessDays 指定のもの）
  const pending = adds.filter((o) => o.businessDays !== undefined);
  for (const o of adds) {
    const ref = String(o.ref ?? "").trim();
    if (!ref) throw new Error("addTask には ref が必要です");
    if (o.days !== undefined) throw new Error(`addTask（${ref}）には days は使えません。営業日は businessDays で指定してください`);
    const hasDue = o.due !== undefined, hasDays = o.businessDays !== undefined;
    if (hasDue === hasDays) throw new Error(`addTask（${ref}）には due か businessDays のどちらか一方が必要です`);
  }
  // 期限を動かす操作と同じ依頼に営業日指定の登録があると、前のタスクの期限が動いて営業日が吸収される。2 回に分けてもらう（addTask 自体の誤りを先に知らせる）
  if (ops.some((o) => o.op === "moveDue") && pending.length) {
    throw new Error("期限の移動（moveDue）と営業日指定の登録（businessDays）は、同じ依頼にできません。先に期限の移動を承認してから、登録を依頼してください");
  }
  const refDue = new Map(adds.filter((o) => o.due !== undefined).map((o) => [String(o.ref).trim(), o.due]));
  while (pending.length) {
    const ready = pending.filter((o) => (o.predecessors ?? []).every((p) => !adds.some((x) => String(x.ref).trim() === p) || refDue.has(p)));
    if (!ready.length) throw new Error("addTask の前のタスクが循環しています");
    for (const o of ready) {
      const open = (o.predecessors ?? []).map((p) => (refDue.has(p) ? { due: refDue.get(p), status: "To Do" } : need(p))).filter((t) => !isClosed(t));
      const base = open.map((t) => t.due).reduce(max, "") || today;
      const ref = String(o.ref).trim();
      dueOf.set(ref, dueAfter(base, o.businessDays, calendarOf(w.settings)));
      refDue.set(ref, dueOf.get(ref));
      pending.splice(pending.indexOf(o), 1);
    }
  }
  const planned = new Map(); // ref → businessDays を due に固定した op
  for (const o of adds) {
    const ref = String(o.ref ?? "").trim();
    if (refs.has(ref)) throw new Error(`ref "${ref}" が重複しています`);
    const due = o.due ?? dueOf.get(ref);
    planned.set(o, o.businessDays === undefined ? o : (({ businessDays, ...rest }) => ({ ...rest, due }))(o));
    // 開始日: 書かれていればそのとおり。前のタスクがあるタスクは入れない（前のタスクから決まる開始日にする）。なければ今日（期限が過去なら入れない）
    const start = o.start ?? ((o.predecessors ?? []).length || due < today ? null : today);
    if (o.checklist !== undefined && (!Array.isArray(o.checklist) || o.checklist.some((x) => typeof x !== "string"))) throw new Error(`addTask（${ref}）の checklist は文字列の配列にしてください`);
    const items = o.checklist?.length ? newChecklist(o.checklist) : [];
    w = addTask(w, { projectId: o.projectId, title: o.title, due, start, group: o.group ?? null, subgroup: o.subgroup ?? null, ...(items.length ? { checklist: items } : {}) });
    const id = w.tasks.at(-1).id;
    refs.set(ref, id);
    inboxIds.add(id);
    addCount++;
  }
  for (const o of adds) {
    const id = refs.get(String(o.ref).trim());
    const preds = (o.predecessors ?? []).map(resolve);
    if (!preds.length) continue;
    for (const p of preds) {
      const pt = need(p);
      if (pt.projectId !== T(id).projectId) throw new Error(`前のタスク ${p} は別のプロジェクトのタスクです`);
      if (before.has(p)) touched.add(p);
    }
    w = updateTask(w, id, { predecessors: preds }, today);
    const lower = preds.map((p) => T(p)).filter((p) => !isClosed(p)).map((p) => p.due).reduce(max, "");
    if (lower > T(id).due) {
      warnings.push(`登録するタスク ${id}（${T(id).title}）の期限は、前のタスクより前なので ${lower} に合わせました`);
      raise(id, lower, "前のタスクの期限に合わせた", inboxIds);
    }
  }

  // ② moveDue（日数は、その時点の期限から数える）
  for (const o of ops.filter((x) => x.op === "moveDue")) {
    const id = resolve(o.taskId);
    const t = need(id);
    if (isClosed(t)) throw new Error(`タスク ${id} は完了しているので、期限を動かせません`);
    let delta;
    if (Number.isInteger(o.deltaDays)) delta = o.deltaDays;
    else if (typeof o.newDue === "string") delta = diffDays(o.newDue, t.due);
    else throw new Error(`moveDue（${id}）には deltaDays か newDue が必要です`);
    if (!delta) throw new Error(`moveDue（${id}）の動かす日数が 0 日です`);
    const impact = computeImpact(w, id, delta, { compress: !!o.compress });
    const ids = [];
    for (const c of impact.changes) { setDue(c.taskId, c.newDue, c.reason); ids.push(c.taskId); }
    // この計画が触った（動かした・前のタスクに足した）前のタスクの期限より前には、手動の前倒しでもしない（遅い方を採る）
    const lower = (T(id).predecessors ?? []).filter((p) => changed.has(p) || touched.has(p)).map((p) => T(p)).filter((p) => !isClosed(p)).map((p) => ({ id: p.id, due: p.due }));
    const need2 = lower.reduce((a, b) => (b.due > a.due ? b : a), { id: null, due: "" });
    if (need2.id && need2.due > T(id).due) {
      warnings.push(`${id} は、前のタスク ${need2.id} の新しい期限より前にできないので、${need2.due} にしました`);
      raise(id, need2.due, `前のタスク ${need2.id} の期限より前にできない`, new Set(ids));
    }
    moves.push({ deltaDays: delta, taskIds: ids });
    for (const x of ids) if (before.has(x)) touched.add(x);
  }

  const { errors } = validate(w);
  if (errors.length) throw new Error(errors.join(" / "));

  const dueRows = [...changed].filter((id) => before.has(id) && T(id) && before.get(id).due !== T(id).due)
    .map((id) => ({ taskId: id, title: T(id).title, oldDue: before.get(id).due, newDue: T(id).due, reason: reasons.get(id) }));
  // プロジェクト期限の超過（動いたタスクがあるプロジェクトだけ）
  for (const p of w.projects ?? []) {
    const movedHere = dueRows.some((r) => T(r.taskId).projectId === p.id && r.newDue > p.due);
    if (!movedHere) continue;
    const latest = w.tasks.filter((t) => t.projectId === p.id).map((t) => t.due).reduce(max, "");
    warnings.push(`${p.name}の期限（${p.due}）を超えます（最後のタスクは ${latest}）`);
  }

  // 前のタスクが、そのまた前のタスクに合わせて引き上げられると、businessDays の期限も引き上げられ、営業日が吸収される。表の営業日と食い違うので知らせる
  for (const o of adds.filter((x) => x.businessDays !== undefined)) {
    const ref = String(o.ref).trim();
    if (T(refs.get(ref)).due !== dueOf.get(ref)) warnings.push(`登録するタスク ${ref}（${o.title}）の営業日 ${o.businessDays} は、前のタスクの期限が引き上げられたため反映されていません（期限は ${T(refs.get(ref)).due}）`);
  }
  const addRows = adds.map((o) => { const t = T(refs.get(String(o.ref).trim())); return { ref: String(o.ref).trim(), title: t.title, projectId: t.projectId, group: t.group ?? null, subgroup: t.subgroup ?? null, due: t.due, businessDays: o.businessDays ?? null, start: t.start ?? null, predecessors: o.predecessors ?? [], checklist: (t.checklist ?? []).map((c) => c.text) }; });
  const sections = [];
  if (addRows.length) sections.push({ kind: "add", rows: addRows });
  if (dueRows.length) sections.push({ kind: "due", rows: dueRows });
  return { data: w, ops: ops.map((o) => planned.get(o) ?? o), sections, warnings, moves, inboxIds: [...inboxIds], addCount };
}

/** 変更案の表の同一性（提案と、いまのデータでの計算結果の比較用）。登録する開始日の既定（日付で変わる）と、理由の文は含めない */
const sectionsKey = (sections) => JSON.stringify(sections.map((s) => [s.kind, s.rows.map((r) =>
  s.kind === "due" ? [r.taskId, r.oldDue, r.newDue] : [r.ref, r.title, r.projectId, r.group, r.subgroup, r.due, r.predecessors, r.checklist])]));

const count = (sections, kind) => sections.find((s) => s.kind === kind)?.rows.length ?? 0;

/** 変更案（sections）の要約。例: 「登録 2 件・期限の変更 3 件」 */
function summarizeSections(sections) {
  return `登録 ${count(sections, "add")} 件・期限の変更 ${count(sections, "due")} 件`;
}

/** 操作の計画（データは変えない）。例外: 不明なタスク・プロジェクト、循環、別のプロジェクトの前のタスク、完了済みの moveDue、依頼で受けない op、など */
function planOps(data, ops, { today }) {
  const s = simulate(data, ops, today);
  return { ops: s.ops, sections: s.sections, warnings: s.warnings };
}

/** 提案を適用する。いまのデータで操作をもう一度計算して、提案の表と違う（または計算できない）ときは、code: "stale" の例外（データは変えない） */
function applyProposal(data, proposal, { reason, cause, today }) {
  const why = String(reason ?? "").trim();
  if (!why) throw new Error("理由を入力してください");
  if (!CAUSES.includes(cause)) throw new Error(`原因は ${CAUSES.join("・")} のいずれかにしてください`);
  // 保存済みの提案に、依頼で受けなくなった操作が残っていたら、提案後にデータが変わったときと同じく、失敗にする（code: "stale"）
  try { checkOps(proposal.ops); } catch (e) { throw Object.assign(e, { code: "stale" }); }
  const stale = (message = "提案のあとにデータが変わりました。もう一度提案してもらってください") => Object.assign(new Error(message), { code: "stale" });

  let s;
  try { s = simulate(data, proposal.ops, today); } catch { throw stale(); }
  if (sectionsKey(s.sections) !== sectionsKey(proposal.sections ?? [])) throw stale();
  const log = [...(s.data.changeLog ?? [])];
  for (const m of s.moves) log.push({ at: today, taskIds: m.taskIds, reason: why, cause, deltaDays: m.deltaDays });
  if (s.addCount) {
    log.push({ at: today, taskIds: [...s.inboxIds], reason: `受信箱: ${summarizeSections(s.sections)}`, cause: null, deltaDays: 0, source: "inbox" });
  }
  const out = { ...s.data, changeLog: log };
  const { errors } = validate(out);
  if (errors.length) throw new Error(errors.join(" / "));
  return out;
}

return { summarizeSections, planOps, applyProposal };
})();

  const id = esc(pd.id);

    return `<div class="ask warn-ck" role="alert" style="max-width:none"><b>チェックリストに、未完了の項目が ${pd.open.length} 件あります。</b><ul>${pd.open.map((x) => `<li>${esc(x)}</li>`).join("")}</ul><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px"><button class="btn" data-ckall="${id}">残りをすべてチェックして ${esc(pd.status)} にする</button><button class="btn" data-ckkeep="${id}">未完了のまま ${esc(pd.status)} にする</button><button class="btn" data-doneno>やめる</button></div></div>`;
  }
  return `<div class="ask" style="max-width:none">${id} の未来の予定の枠 ${pd.n} 件を解除して ${esc(pd.status)} にします。<div style="display:flex;gap:6px;margin-top:4px"><button class="btn danger" data-doneok="${id}">解除して ${esc(pd.status)} にする</button><button class="btn" data-doneno>やめる</button></div></div>`;
}

/** 今日の日付に作業枠（予定・実績・未確認）があるタスクを [{ t, slots }] で返す。未完了を最初の枠の開始順に、Done・Cancelled を末尾に */
function todayList(data, today) {
  const rows = data.tasks
    .map((t) => ({ t, slots: (t.sessions ?? []).filter((s) => s.date === today).sort((a, b) => a.start.localeCompare(b.start)) }))
    .filter((r) => r.slots.length);
  return rows.sort((a, b) => isClosed(a.t) - isClosed(b.t) || a.slots[0].start.localeCompare(b.slots[0].start));
}

const todayTaskIds = (data, today) => todayList(data, today).map((r) => r.t.id);

/** 今日のタスク。今日に枠が無ければ空文字
 *  @param opts.pendingDone  未来の予定の枠を解除する確認待ち { id, status, n }（その行に確認を出す） */
function renderTodayTasks(data, today, opts = {}) {
  const rows = todayList(data, today);
  if (!rows.length) return "";
  const items = rows.map(({ t, slots }) => {
    const proj = esc(data.projects.find((p) => p.id === t.projectId)?.name ?? "");
    const times = slots.map((s) => esc(`${s.start}–${s.end}`)).join("、");
    const ask = opts.pendingDone?.id === t.id ? doneAskHtml(opts.pendingDone) : "";
    return `<li data-today="${esc(t.id)}"${isClosed(t) ? ' class="closed"' : ""}><span class="pj">${proj}</span><span class="t">${esc(t.title)} ${statusPill(t)}</span><span class="why mono">${times}</span>${isClosed(t) ? "" : checkMeterHtml(t, { remain: true })}${isClosed(t) ? "" : statusButtons(t)}${ask}</li>`;
  }).join("");
  return `<section class="panel todaytasks" aria-labelledby="h-td"><h2 id="h-td">今日のタスク</h2><ul class="rank tl">${items}</ul></section>`;
}

/**
 * @param opts.sched   true ならスケジュール画面用（全件・ドラッグ可）。false なら上位 4 件
 * @param opts.picked  選択中のタスク ID
 * 今日のタスクに入っているタスクは出さない（順位の計算は変えず、表示で除く）
 */
function renderPrio(data, today, opts = {}) {
  const { sched = false, picked = null } = opts;
  const inToday = new Set(todayTaskIds(data, today));
  const ranked = rankTasks(data, today).filter((r) => !inToday.has(r.taskId));
  const shown = sched ? ranked : ranked.slice(0, 4);
  const items = shown.map((r, i) => {
    const t = data.tasks.find((x) => x.id === r.taskId);
    const a = taskActual(data, t.id);
    const pill = a.count ? ` <span class="pill ok">${a.count}回・実績 ${a.hours.toFixed(1)}h</span>` : "";
    const proj = esc(data.projects.find((p) => p.id === t.projectId)?.name ?? "");
    const drag = sched ? ` draggable="true" data-pick="${esc(t.id)}" tabindex="0"` : "";
    return `<li${drag} class="${picked === t.id ? "picked" : ""}"><span class="n">${i + 1}</span><span class="pj">${proj}</span><span class="t">${r.action === "chase" ? `<span class="act">${r.reasons.some((x) => x.includes("催促")) ? "催促" : "確認"}</span>` : ""}${esc(t.title)} ${statusPill(t)}${pill}</span>${checkMeterHtml(t, { remain: true })}<span class="why">${esc(r.reasons.join("。"))}</span></li>`;
  }).join("");
  const note = sched
    ? "タスクをカレンダーへドラッグして配置します(15分刻み・長さ1時間)。配置済みの枠もドラッグで移動できます。キーボードでは、タスクを選んで日表示の空き枠を押します。"
    : "スケジュール画面で、時間枠に配置できます。";
  return `<section class="panel prio" aria-labelledby="h-rk"><h2 id="h-rk">今日の優先</h2>${shown.length ? `<ol class="rank">${items}</ol>` : `<p class="muted">優先するタスクはありません。</p>`}<p class="note" style="margin:10px 0 0">${note}</p></section>`;
}

/** 右の列: 今日のタスク（あれば）＋今日の優先。列の直下の要素として固定表示（sticky）にするため、1 つの箱にまとめる */
function renderSide(data, today, opts = {}) {
  return `<div class="side">${renderTodayTasks(data, today, opts)}${renderPrio(data, today, opts)}</div>`;
}

/** 本体と右の列の境界線の取っ手。押すと右の列（今日のタスク・今日の優先）を開け閉めする。閉じても、この取っ手は残る */
const renderSideToggle = (open) =>
  `<button class="side-toggle" data-pref="prio" aria-expanded="${open}" aria-label="${open ? "今日の優先を閉じる" : "今日の優先を開く"}" title="${open ? "右の「今日のタスク」「今日の優先」を閉じます" : "右の「今日のタスク」「今日の優先」を開きます"}">${open ? "›" : "‹"}</button>`;

return { doneAskHtml, todayTaskIds, renderTodayTasks, renderPrio, renderSide, renderSideToggle };
})();

/* src/ui/views/gantt.js */
const { assignLevels, layoutMilestones, renderGantt } = (() => {
// ガントチャート。位置と幅はすべて範囲全体に対する % で表し、画面幅に追従させる。








const GANTT_WINDOWS = [["m1", "1か月"], ["m3", "3か月"], ["m6", "6か月"], ["y1", "1年"], ["all", "全期間"]];

const legend = (showActual) => `<div class="legend"><span><i class="gbar b-todo" style="position:static;display:inline-block;width:22px;height:10px"></i>To Do</span><span><i class="gbar b-prog" style="position:static;display:inline-block;width:22px;height:10px"></i>In Progress</span><span><i class="gbar b-wait" style="position:static;display:inline-block;width:22px;height:10px"></i>Waiting</span><span><i class="gbar b-done" style="position:static;display:inline-block;width:22px;height:10px"></i>Done</span><span><i class="gbar gsum" style="position:static;display:inline-block;width:22px;height:8px"></i>プロジェクト全体</span><span><i class="ms" style="position:static;display:inline-block;transform:rotate(45deg);width:9px;height:9px"></i>マイルストーン</span>${showActual ? `<span><i class="gact" style="position:static;display:inline-block;width:22px;height:5px"></i>実績(最初の作業日〜完了日・今日)</span>` : ""}<span><i class="imp-key hi"></i>重要度 高（行を薄い赤で塗る）</span><span>開始日は、未入力なら前のタスクの期限から</span></div>`;

function tools(win, hideDone) {
  const seg = GANTT_WINDOWS.map(([k, l]) => `<button data-gwin="${k}" aria-pressed="${win === k}">${l}</button>`).join("");
  return `<div class="gtools"><span class="note">表示期間</span><div class="seg" role="group" aria-label="表示期間">${seg}</div><button class="chip-btn" data-hidedone aria-pressed="${hideDone}">完了を隠す</button><button class="chip-btn" data-gotoday>今日へ移動</button></div>`;
}

/**
 * マイルストーンのラベルを、重ならない最初の段へ置く。items は日付順の { x: ラベルの左端, w: 幅 }。戻り値は、各ラベルの段（0 から）。
 */
function assignLevels(items) {
  const ends = [];
  return items.map(({ x, w }) => {
    let level = ends.findIndex((e) => e <= x);
    if (level < 0) level = ends.length;
    ends[level] = x + w;
    return level;
  });
}

const msLaneHeight = (levels) => Math.max(44, (Math.max(-1, ...levels) + 1) * 18 + 8);

/**
 * 描いたあとに、マイルストーンのラベルの実際の幅を測って、段と行の高さを決め直す（画面幅・表示期間で、重なりが変わるため）。
 */
function layoutMilestones(gbodies) {
  // 測ると書くを混ぜると、そのたびにレイアウトが走る。先に全部を測り、そのあとで全部を書く（deps.js と同じ）
  const plans = [];
  for (const gb of gbodies) {
    const lane = gb.querySelector(".g-msrow .g-lane");
    if (!lane || !lane.offsetWidth) continue; // 隠れている（幅 0）ときは、測れないので触らない
    const marks = [...lane.querySelectorAll(".ms")];
    const labels = [...lane.querySelectorAll(".ms-l")];
    const levels = assignLevels(labels.map((l) => ({ x: l.offsetLeft, w: l.offsetWidth + 10 + 8 }))); // 10px はラベルの右ずらし、8px はラベルの間の隙間
    plans.push({ lane, marks, labels, levels });
  }
  for (const { lane, marks, labels, levels } of plans) {
    levels.forEach((lv, i) => { marks[i].style.top = `${6 + lv * 18}px`; labels[i].style.top = `${2 + lv * 18}px`; });
    lane.style.height = `${msLaneHeight(levels)}px`;
  }
}

/**
 * @param opts.window    "m1" | "m3" | "m6" | "y1" | "all"
 * @param opts.hideDone  Done の行を隠す（全体バーの進捗には影響しない）
 * @param opts.askDel    削除確認を出すタスク ID
 * @param opts.showActual false なら実績の線と凡例を出さない
 * @param opts.addAt     名前入力を開いている見出し { pid, group, subgroup }（なければ null）
 */
function renderGantt(data, projectIds, today, opts = {}) {
  const { window: win = "m6", hideDone = false, askDel = null, showActual = true, addAt = null } = opts;
  const all = projectIds.map((id) => data.projects.find((p) => p.id === id));
  // 完了を隠すは、複数のプロジェクトを出しているとき、完了したプロジェクト（状態が「完了」、またはタスクが 1 件以上あって全部 Done）も隠す。1 つを選んでいるときは隠さない
  const closed = (p) => { const ts = data.tasks.filter((t) => t.projectId === p.id); return p.status === "完了" || (ts.length > 0 && ts.every((t) => t.status === "Done")); };
  const ps = hideDone && all.length > 1 ? all.filter((p) => !closed(p)) : all;
  // 編集画面は、道具と凡例を上端の固定の帯に置く（タスクが多くても、スクロール中に色の意味を見失わない）
  const top = `<div class="gtop">${tools(win, hideDone)}${legend(showActual)}</div>`;
  if (!ps.length) return `${top}<p class="muted">完了したプロジェクトを隠しています。「完了を隠す」を押すと、また出ます。</p>`;

  const geo = new Map(ps.map((p) => [p.id, ganttRows(data, p.id, today)]));
  const starts = [...geo.values()].map((g) => g.range.start);
  const ends = [...geo.values()].map((g) => g.range.end);
  const s0 = [addDays(today, -10), ...starts].reduce((a, b) => (a < b ? a : b));
  const e0 = [addDays(today, 14), ...ends].reduce((a, b) => (a > b ? a : b));
  const range = { start: s0, end: e0 };
  const total = diffDays(e0, s0) + 1;
  const { visibleDays, ratio, scale } = ganttLayout(range, win);
  const dayScale = scale === "day";
  const x = (d) => `${((diffDays(d, s0) / total) * 100).toFixed(3)}%`;
  const ticks = timeTicks(range, scale);
  const rest = restDayChecker(data.settings);
  const laneW = `calc((100cqw - var(--lw) - 12px) * ${ratio.toFixed(4)})`;
  const laneStyle = `style="width:var(--lanew)"`;

  const axis = ticks
    .filter((t) => dayScale || Math.abs(diffDays(t.date, today)) > visibleDays * 0.045)
    .map((t) => `<span class="mono ${t.yearStart ? "yr" : ""} ${dayScale && t.date === today ? "tdy" : ""}" data-tick="${t.date}" style="left:${x(t.date)}">${esc(t.label)}${dayScale ? `<small>${wdJa(t.date)}</small>` : ""}</span>`)
    .join("");
  const grid = (dayScale ? ticks.filter((t) => rest(t.date)).map((t) => `<i class="gwk" style="left:${x(t.date)};width:${(100 / total).toFixed(3)}%"></i>`).join("") : "")
    + ticks.map((t) => `<i class="gl ${t.yearStart ? "yr" : ""}" style="left:${x(t.date)}"></i>`).join("");
  const todayLine = `<span class="todayline" style="left:${x(today)}"></span>`;

  const scrollAttrs = ` data-todayfrac="${(diffDays(today, s0) / total).toFixed(5)}" data-s0="${s0}" data-span="${total}"`; // 全プロジェクト共通(ドラッグ・今日へ移動が .gscroll から読む)
  const sections = ps.map((p) => {
    const g = geo.get(p.id);
    const prog = projectProgress(data, p.id);
    const hh = projectHours(data, p.id);
    const pct = Math.round(prog.rate * 100);
    const flags = projectFlags(data, p.id, today);
    const ms = g.milestones;
    const msLines = ms.map((m) => `<i class="msl" style="left:${x(m.date)}"></i>`).join("");

    // 段は、画面幅を 1000px と仮定した見積もり。画面では、描いたあとに layoutMilestones が実測で決め直す
    const pxPerDay = 1000 / visibleDays;
    const levels = assignLevels(ms.map((m) => ({ x: diffDays(m.date, s0) * pxPerDay, w: [...m.name].reduce((n, c) => n + (c.charCodeAt(0) < 256 ? 6 : 11), 0) + 40 + 18 })));
    const msItems = ms.map((m, i) => {
      const level = levels[i];
      const idx = (p.milestones ?? []).findIndex((o) => o.name === m.name && o.date === m.date);
      const attr = ` data-gms="${esc(p.id)}|${idx}"`;
      return `<i class="ms"${attr} style="left:${x(m.date)};top:${6 + level * 18}px" title="${esc(m.name)} ${fmtMD(m.date)}(ドラッグで日付を変更)"></i><span class="ms-l" style="left:${x(m.date)};top:${2 + level * 18}px">${esc(m.name)} <b class="mono">${fmtMD(m.date)}</b></span>`;
    }).join("");
    const msRow = ms.length
      ? `<div class="g-row g-msrow"><div class="g-label"><span class="id"></span><span class="muted">マイルストーン</span></div><div class="g-lane" style="width:var(--lanew);height:${msLaneHeight(levels)}px">${msItems}</div></div>`
      : "";

    const months = Math.max(1, Math.round(diffDays(p.due, p.start) / 30.4));
    const head = `<div class="pg-head"><div><button class="proj-name" data-filter="${esc(p.id)}">${esc(p.name)}</button><div class="proj-meta"><span>${esc(p.type)}</span><span>${esc(p.status)}</span><span class="mono">${fmtMD(p.start)}〜${fmtMD(p.due)}(${months}か月)</span><span class="mono">${prog.done}/${prog.total} Done (${pct}%)</span><span class="mono hrs">稼働 ${(hh.task + hh.meeting).toFixed(1)}h（タスク ${hh.task.toFixed(1)}h・会議 ${hh.meeting.toFixed(1)}h）</span>${flagPills(data, p.id, today, flags)}</div></div><button class="btn" data-open="${esc(p.id)}">編集する</button></div>`;

    // バーは、開始日のマスから期限日のマスの右端まで（期限の日を含む）。期限の表示は、その右に付ける
    const sumW = Math.max(0, ((diffDays(p.due, p.start) + 1) / total) * 100).toFixed(3);
    const sumAttr = ` data-gp="${esc(p.id)}"`;
    const sumHandles = `<b class="gh l" data-gh="l"></b><b class="gh r" data-gh="r"></b>`;
    const sumRow = `<div class="g-row g-sumrow"><div class="g-label"><span class="id"></span><span class="muted">プロジェクト全体</span></div><div class="g-lane" ${laneStyle}><i class="gbar gsum"${sumAttr} style="left:${x(p.start)};width:${sumW}%;min-width:4px" title="${fmtMD(p.start)}〜${fmtMD(p.due)}(両端のドラッグで開始・期限を変更)"><u style="width:${pct}%"></u>${sumHandles}</i><span class="g-due mono" style="left:${x(addDays(p.due, 1))}">${fmtMD(p.due)}</span></div></div>`;

    const taskOf = (r) => data.tasks.find((o) => o.id === r.taskId);
    const shown = (r) => !(hideDone && taskOf(r).status === "Done");
    const rowHtml = (r) => {
      const t = data.tasks.find((o) => o.id === r.taskId);
      const late = taskFlags(t, today, data.settings).includes("overdue");
      const ui = STATUS_UI[t.status] ?? STATUS_UI["To Do"];
      const hasPre = (t.predecessors ?? []).length > 0;
      const gt = ` data-gt="${esc(t.id)}"${hasPre ? ` data-pre="${esc(t.predecessors.join(" "))}"` : ""}`;
      const drag = " gdrag";
      const label = `${esc(t.id)} ${esc(t.title)} ${fmtMD(r.start)}〜${fmtMD(r.end)}`;
      const ck = checklistCount(t);
      const ckFill = ck.total && t.status !== "Done" && t.status !== "Cancelled" ? `<u class="gck" style="width:${Math.round((ck.done / ck.total) * 100)}%"></u>` : ""; // 済みの割合だけ濃く塗る（完了したタスクは今までどおり）
      const bar = r.point
        ? `<i class="dot mk${drag} ${ui.dot}${late ? " is-late" : ""}"${gt} style="left:calc(${x(r.end)} + ${(50 / total).toFixed(3)}%)" title="${label}(ドラッグで期限を変更)"></i>`
        : `<i class="gbar${drag} ${ui.bar}${ckFill ? " ck" : ""}${late ? " is-late" : ""}"${gt} style="left:${x(r.start)};width:${(((diffDays(r.end, r.start) + 1) / total) * 100).toFixed(3)}%;min-width:5px" title="${label}(クリックで編集、ドラッグで移動、両端で開始・期限を変更)">${ckFill}<b class="gh l" data-gh="l"></b><b class="gh r" data-gh="r"></b></i>`;
      const act = r.actual && showActual
        ? `<i class="gact" style="left:${x(r.actual.start)};width:${((Math.max(diffDays(r.actual.end, r.actual.start), 0) + 1) / total * 100).toFixed(3)}%;min-width:4px" title="実績 ${fmtMD(r.actual.start)}〜${fmtMD(r.actual.end)}"></i>`
        : "";
      const dependents = data.tasks.filter((o) => (o.predecessors ?? []).includes(t.id)).map((o) => o.id);
      let lab;
      if (askDel === t.id) {
        lab = `<div class="g-label"><span class="id">${esc(t.id)}</span><div class="ask" style="grid-column:2/-1">${dependents.length ? `次のタスク ${esc(dependents.join(", "))} の前のタスクから外れます。` : "このタスクを削除します。"}<div style="display:flex;gap:6px;margin-top:4px"><button class="btn danger" data-delyes="${esc(t.id)}">削除する</button><button class="btn" data-delno>やめる</button></div></div></div>`;
      } else {
        const name = `<button class="g-name" data-gedit="${esc(t.id)}" title="クリックで編集">${esc(t.title)}</button>`;
        const del = `<button class="gx" data-del="${esc(t.id)}" aria-label="${esc(t.id)} を削除">×</button>`;
        const imp = t.importance === "high" && !["Done", "Cancelled"].includes(t.status) ? " imp-high" : ""; // 重要度の印（高）。完了したタスクには付けない
        lab = `<div class="g-label${imp}" data-mvrow="${esc(t.id)}"><span class="mv" draggable="true" data-mvh="${esc(t.id)}" title="ドラッグで並べ替え" aria-label="${esc(t.id)} を並べ替え">⠿</span><span class="id">${esc(t.id)}</span>${name}${del}<span class="g-pre">${hasPre ? "← " + esc(t.predecessors.join(", ")) : ""}</span>${checkMeterHtml(t)}</div>`;
      }
      return `<div class="g-row">${lab}<div class="g-lane" ${laneStyle}>${bar}${act}<span class="g-due mono" style="left:${x(addDays(r.end, 1))}">${fmtMD(t.due)}</span></div></div>`;
    };
    // (大項目, 中項目) ごとに見出し行を入れて並べる。追加の入口になるので、大項目がなくても「（なし）」の見出しを常に出す。
    // 見出しは完了を隠していても残す（そのグループへ追加できるように）
    const base = g.rows;
    const heading = (sec) => {
      const name = `${sec.group || "（なし）"}${sec.subgroup ? ` ▸ ${sec.subgroup}` : ""}`;
      const at = `data-ag="${esc(sec.group)}" data-asg="${esc(sec.subgroup)}"`;
      const opening = addAt && addAt.pid === p.id && addAt.group === sec.group && addAt.subgroup === sec.subgroup;
      const ctl = opening ? `<input class="in" data-gadd="${esc(p.id)}" ${at} placeholder="タスク名を入力して Enter" aria-label="${esc(name)} に追加するタスク名"><button class="plus" data-gaddok="${esc(p.id)}">追加</button><button class="plus" data-gaddno>やめる</button>`
        : `<button class="plus" data-gopen="${esc(p.id)}" ${at} aria-label="${esc(name)} にタスクを追加">＋</button>`;
      return `<div class="g-row g-grp"><div class="g-label" data-mvgrp="${esc(p.id)}" data-mvg="${esc(sec.group)}" data-mvsg="${esc(sec.subgroup)}"><span class="g-grp-t"><b>${esc(sec.group || "（なし）")}</b>${sec.subgroup ? ` <span class="muted">▸ ${esc(sec.subgroup)}</span>` : ""}</span>${ctl}</div><div class="g-lane" ${laneStyle}></div></div>`;
    };
    const secs = groupSections(base.map((r) => ({ ...taskOf(r), row: r })), { ensureNone: true });
    const rows = secs
      .map((sec) => `${heading(sec)}${sec.tasks.filter((x) => shown(x.row)).map((x) => rowHtml(x.row)).join("")}`).join("");

    const headRow = `<div class="g-row g-head"><div class="g-label"></div><div class="g-lane g-axis ${dayScale ? "day" : ""}" ${laneStyle}>${dayScale ? "" : `<span class="todaytag" style="left:${x(today)}">今日</span>`}${axis}</div></div>`;

    const gbody = `<div class="gbody" style="--lanew:${laneW}"><div class="gov under">${grid}</div><div class="gov over">${msLines}${todayLine}</div>${headRow}${msRow}${sumRow}${rows}</div>`;
    // プロジェクトごとに、固定の見出し(.pgstick。画面の縦スクロールに sticky)と、横スクロールだけの枠(.gscroll)に分ける。
    // 枠は横スクロールの枠なので、その中では sticky が画面の縦スクロールに効かない。見出しは枠の外に置く。日付軸の複製(.gstrip)は app.js が作る
    return `<section class="pg" aria-label="${esc(p.name)}"><div class="pgstick">${head}</div><div class="gwrap"><div class="gstrip" aria-hidden="true"></div><div class="gscroll"${scrollAttrs}><div class="gwide">${gbody}</div></div></div></section>`;
  }).join("");

  return `${top}<div class="gprojects">${sections}</div>`;
}

return { assignLevels, layoutMilestones, renderGantt };
})();

/* src/ui/views/schedule.js */
const { snapStart, weekStartOf, calendarGeometry, renderCalendar, renderSchedule } = (() => {
// スケジュール画面（週／日）。位置と高さは勤務時間に対する % で表し、カレンダーの高さは CSS で画面に追従させる。









const SLOT_STEP = 15;

/** 15 分刻みに丸め、勤務時間内に収める（開始の分を返す） */
function snapStart(minutes, durationMin, workday = DEFAULT_WORKDAY) {
  const [ws, we] = [toMin(workday.start), toMin(workday.end)];
  return Math.max(ws, Math.min(Math.round(minutes / SLOT_STEP) * SLOT_STEP, we - durationMin));
}

const weekStartOf = (d) => addDays(d, -((weekday(d) + 6) % 7));

/** 勤務時間 → 位置計算（すべて % ） */
function calendarGeometry(data) {
  const wd = data.settings?.workday ?? DEFAULT_WORKDAY;
  const h0 = toMin(wd.start);
  const span = toMin(wd.end) - h0;
  const pc = (m) => ((m - h0) / span) * 100;
  return { wd, h0, span, pc, tp: (m) => `${pc(m).toFixed(3)}%`, ht: (a, b) => `calc(${(pc(b) - pc(a)).toFixed(3)}% - 2px)` };
}

const hoursHtml = (g) => {
  let s = "";
  for (let h = Math.ceil(g.h0 / 60); h * 60 <= g.h0 + g.span; h++) s += `<div class="hour" style="top:${(((h * 60 - g.h0) / g.span) * 100).toFixed(3)}%"><span>${h}:00</span></div>`;
  return s;
};

function meetingBlocks(data, d, full, g, ctx) {
  return (data.events ?? []).filter((m) => m.date === d && (ctx.showSkipped || !m.skip || ctx.selMtg === m.id)).map((m) => {
    const a = Math.max(toMin(m.start), g.h0);
    const b = Math.min(toMin(m.end), g.h0 + g.span);
    if (b <= a) return "";
    const manual = m.source === "manual";
    const kind = meetingKind(m, ctx.now);
    const kc = kind === "actual" ? "act" : kind === "unconfirmed" ? "unconf" : "";
    const mark = m.skip ? " 不参加" : kind === "actual" ? " ✓" : kind === "unconfirmed" ? " 未確認" : "";
    const pname = (data.projects ?? []).find((p) => p.id === m.projectId)?.name;
    const by = m.projectBy === "manual" ? "（手動）" : m.projectBy === "rule" ? "（規則）" : "";
    const proj = full ? `<span class="mp">${pname ? `プロジェクト: ${esc(pname)}${by}` : "プロジェクト未設定"}</span>` : "";
    const confirm = full && kind === "unconfirmed" ? `<span class="bb"><button class="btn" data-confirmmtg="${esc(m.id)}">実績にする</button></span>` : "";
    return `<div class="blk mtg ${m.skip ? "skip" : ""} ${kc} ${ctx.selMtg === m.id ? "sel" : ""}" data-mtg="${esc(m.id)}" tabindex="0" ${manual ? `draggable="true" data-dragmtg="${esc(m.id)}"` : ""} style="top:${g.tp(a)};height:${g.ht(a, b)}" title="${esc(m.title)}${m.skip ? "(参加しない)" : ""}${manual ? "" : "(予定表から取得)"}"><span class="tm">${esc(m.start)}-${esc(m.end)}${mark}</span>${esc(m.title)}${proj}${confirm}${manual ? `<i class="rz" data-rzm="${esc(m.id)}" aria-label="終了時刻を変更"></i>` : ""}</div>`;
  }).join("");
}

const KIND_CLS = { actual: "act", unconfirmed: "unconf", planned: "plan" };
const KIND_JA = { act: "実績", unconf: "未確認", plan: "予定" };
/** 日表示の枠に出す、タスクの状態の文字 */
const STATUS_JA = { "To Do": "未着手", "In Progress": "着手中", Waiting: "待ち", Done: "完了", Cancelled: "中止" };

function sessionBlocks(data, d, full, g, ctx) {
  return allSessions(data).filter((s) => s.date === d).map((s) => {
    const kind = sessionKind(s, ctx.now);
    const c = KIND_CLS[kind];
    const confirm = full && kind === "unconfirmed" ? `<span class="bb"><button class="btn" data-confirm="${esc(s.id)}">実績にする</button></span>` : "";
    const st = full ? ` <span class="stt">${STATUS_JA[data.tasks.find((t) => t.id === s.taskId).status] ?? ""}</span>` : "";
    return `<div class="blk task ${c} ${ctx.selSess === s.id ? "sel" : ""}" draggable="true" tabindex="0" data-dragsess="${esc(s.id)}" style="top:${g.tp(toMin(s.start))};height:${g.ht(toMin(s.start), toMin(s.end))}" title="${esc(s.title)}(${KIND_JA[c]})"><span class="tm">${esc(s.start)}-${esc(s.end)}${c === "act" ? " ✓" : c === "unconf" ? " 未確認" : ""}</span>${full ? `${esc(s.taskId)} ` : ""}${esc(s.title)}${st}${confirm}<i class="rz" data-rz="${esc(s.id)}" aria-label="終了時刻を変更"></i></div>`;
  }).join("");
}

/** 会議と配置済みの枠を除いた空き時間 */
function freeOf(data, d, g, isOff) {
  if (isOff(d)) return [];
  const busy = [...(data.events ?? []), ...allSessions(data)].filter((x) => x.date === d);
  return freeSlots(busy, d, g.wd);
}

function meetingForm(data, ctx) {
  const draft = ctx.mtgDraft;
  const m = draft ?? (data.events ?? []).find((o) => o.id === ctx.selMtg);
  if (!m) return "";
  const isNew = !!draft;
  const lock = !isNew && m.source === "mcp" ? "disabled" : "";
  const projects = data.projects ?? [];
  const autoId = matchProject(m.title, (data.settings?.projectRules ?? []).filter((r) => projects.some((p) => p.id === r.projectId)));
  const autoName = projects.find((p) => p.id === autoId)?.name ?? "未設定";
  const cur = isNew ? (m.projectId ?? "") : m.projectBy === "manual" ? m.projectId : "";
  const projOpts = [`<option value=""${cur === "" ? " selected" : ""}>自動（規則）→ ${esc(autoName)}</option>`, ...projects.map((p) => `<option value="${esc(p.id)}"${cur === p.id ? " selected" : ""}>${esc(p.name)}</option>`)].join("");
  return `<div class="mtgform" role="group" aria-label="会議の${isNew ? "追加" : "編集"}">
    <label>件名<input class="in" data-mt="title" value="${esc(m.title)}" placeholder="会議名" style="min-width:200px" ${lock}></label>
    <label>日付<input class="in" type="date" data-mt="date" value="${esc(m.date)}" ${lock}></label>
    <label>開始<input class="in" type="time" step="900" data-mt="start" value="${esc(m.start)}" ${lock}></label>
    <label>終了<input class="in" type="time" step="900" data-mt="end" value="${esc(m.end)}" ${lock}></label>
    <label>プロジェクト<select class="in" data-mt="projectId" aria-label="会議のプロジェクト">${projOpts}</select></label>
    <label class="chk"><input type="checkbox" data-mt="skip" ${m.skip ? "checked" : ""}>参加しない(空き時間として扱う)</label>
    <div style="display:flex;gap:6px;align-items:center">${isNew ? `<button class="btn" data-mtgsave>追加</button><button class="btn" data-mtgcancel>キャンセル</button>` : `${m.source === "manual" ? `<button class="btn danger" data-delsel>会議を削除</button>` : ""}<button class="btn" data-mtgclose>閉じる</button>`}</div>
    ${!isNew && m.source === "manual" ? `<p class="note" style="flex-basis:100%;margin:0">カレンダー上でドラッグして移動（別の日へも）、下端をドラッグして長さを変えられます。</p>` : ""}${!isNew && m.source === "mcp" ? `<p class="note" style="flex-basis:100%;margin:0">予定表から取得した会議です。件名と時間は取得内容が正のため変更できません。プロジェクトは、規則で自動に付き、ここで手動に変えられます。出席しない会議は「参加しない」にします（削除しても、次の取得で戻ります）。</p>` : ""}
  </div>`;
}

/** カレンダー部分（週または日）＋凡例。会議の編集中はここだけを描き直す */
function renderCalendar(data, today, opts) {
  const { view = "week", date = today } = opts;
  const ctx = { now: opts.now ?? { date: today, time: "00:00" }, selSess: opts.selSess ?? null, selMtg: opts.selMtg ?? null, showSkipped: opts.showSkipped === true };
  const g = calendarGeometry(data);
  const isOff = offDayChecker(data.settings);
  let cal;
  if (view === "week") {
    const days = [0, 1, 2, 3, 4, 5, 6].map((i) => addDays(weekStartOf(date), i));
    const heads = days.map((d) => {
      const free = freeOf(data, d, g, isOff).reduce((a, x) => a + toMin(x.end) - toMin(x.start), 0);
      return `<button class="dh ${d === today ? "t" : ""}" data-day="${d}" aria-label="${fmtMD(d)}の1日表示">${fmtMD(d)}(${wdJa(d)})<small class="mono">${isOff(d) ? "—" : `空き ${(free / 60).toFixed(1)}h`}</small></button>`;
    }).join("");
    const cols = days.map((d) => `<div class="col dz ${d === today ? "today" : ""} ${isOff(d) ? "weekend" : ""}" data-date="${d}">${meetingBlocks(data, d, false, g, ctx)}${sessionBlocks(data, d, false, g, ctx)}</div>`).join("");
    const dues = days.map((d) => {
      const due = data.tasks.filter((t) => t.due === d && t.status !== "Done" && t.status !== "Cancelled");
      return `<div class="duecell">${due.map((t) => `<div style="display:flex;gap:6px;align-items:baseline"><i class="dot ${STATUS_UI[t.status]?.dot ?? ""}${t.due < today ? " is-late" : ""}"></i><span>${esc(t.title)}</span></div>`).join("") || '<span class="muted">—</span>'}</div>`;
    }).join("");
    cal = `<div class="cal wk"><div class="week"><div></div>${heads}<div class="hrs">${hoursHtml(g)}</div>${cols}</div><div class="week" style="margin-top:8px"><div class="note" style="padding-top:6px">期限</div>${dues}</div></div>
      <p class="note" style="margin:8px 0 0">日付を押すと1日表示に切り替わります。枠をクリックして選び、「枠を削除」か Delete キーで削除できます。</p>`;
  } else {
    const free = freeOf(data, date, g, isOff).filter((x) => toMin(x.end) - toMin(x.start) >= 20);
    const fb = free.map((x) => `<button class="free" data-free="${toMin(x.start)}" style="top:calc(${g.pc(toMin(x.start)).toFixed(3)}% + 1px);height:calc(${(g.pc(toMin(x.end)) - g.pc(toMin(x.start))).toFixed(3)}% - 3px)" aria-label="空き ${x.start}から${x.end}">${x.start}-${x.end} 空き</button>`).join("");
    const nowLine = date === ctx.now.date && toMin(ctx.now.time) >= g.h0 && toMin(ctx.now.time) <= g.h0 + g.span ? `<span class="nowline" style="top:${g.tp(toMin(ctx.now.time))}" title="現在 ${ctx.now.time}"></span>` : "";
    const offKinds = data.settings?.countWeekendsAndHolidays === true ? "休み" : "土日・日本の祝日・休み"; // 土日祝を営業日に数える設定のときは、手動の休みだけが休みの日
    const offNote = isOff(date) ? `<p class="note" style="margin:0 0 8px">この日は休みです（${offKinds}）。作業枠は置けません。設定タブの「営業日として扱う日」に指定すると置けます。</p>` : "";
    cal = `${offNote}<div class="cal"><div class="cal-grid">${hoursHtml(g)}<div class="cal-body dz" id="calbody" data-date="${date}">${meetingBlocks(data, date, true, g, ctx)}${sessionBlocks(data, date, true, g, ctx)}${fb}${nowLine}</div></div></div>`;
  }
  const day = view === "day";
  const legend = `<div class="slegend" aria-label="色の凡例"><span><i class="sw mtg"></i>会議</span>${ctx.showSkipped ? '<span><i class="sw skipsw"></i>参加しない会議</span>' : ""}<span><i class="sw mtgun"></i>未確認の会議</span><span><i class="sw plan"></i>予定</span><span><i class="sw act"></i>実績(✓)</span><span><i class="sw unconf"></i>未確認(過ぎた予定)</span>${day ? '<span><i class="sw free"></i>空き時間</span><span><i class="sw now"></i>現在時刻</span>' : ""}<span><i class="sw sel"></i>選択中</span></div>`;
  return cal + legend;
}

/**
 * @param opts.view      "week" | "day"
 * @param opts.date      表示する日（週表示ではその日を含む週）
 * @param opts.now       {date, time}  現在時刻（過ぎた予定の判定に使う）
 * @param opts.selSess   選択中の枠 ID / opts.selMtg 選択中の会議 ID / opts.mtgDraft 追加中の会議の下書き
 * @param opts.picked    選択中のタスク ID（キーボード配置用）
 * @param opts.showPrio  false なら今日の優先を出さない
 * @param opts.showSkipped  true なら「参加しない」の会議も出す（既定は出さない。選択中の会議だけは、隠さない。空き時間の計算は変わらない）
 */
function renderSchedule(data, today, opts) {
  const { view = "week", date = today } = opts;
  const now = opts.now ?? { date: today, time: "00:00" };
  const step = view === "week" ? 7 : 1;
  const days = view === "week" ? [0, 1, 2, 3, 4, 5, 6].map((i) => addDays(weekStartOf(date), i)) : [date];
  const title = view === "week" ? `${fmtMD(days[0])}〜${fmtMD(days[6])} の週` : `${fmtMD(date)}(${wdJa(date)})`;
  const inView = allSessions(data).filter((s) => days.includes(s.date));
  const kinds = inView.map((s) => sessionKind(s, now));
  const hours = inView.filter((s, i) => kinds[i] === "actual").reduce((a, s) => a + toMin(s.end) - toMin(s.start), 0) / 60;
  const planned = kinds.filter((k) => k === "planned").length;
  const unconfS = kinds.filter((k) => k === "unconfirmed").length;
  const unconfM = (data.events ?? []).filter((m) => days.includes(m.date) && meetingKind(m, now) === "unconfirmed").length;
  const unconf = unconfS + unconfM;
  const selSess = inView.find((s) => s.id === opts.selSess);
  const selMtg = (data.events ?? []).find((m) => m.id === opts.selMtg && days.includes(m.date));
  const delLabel = selSess ? `「${esc(selSess.title)}」の枠を削除` : selMtg && selMtg.source === "manual" ? `会議「${esc(selMtg.title)}」を削除` : "枠や会議を選んで削除";
  const delOk = !!selSess || (selMtg && selMtg.source === "manual");
  const calOpts = { ...opts, view, date, now, selSess: selSess?.id ?? null, selMtg: selMtg?.id ?? null };

  const nav = `<div class="toolbar"><div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"><button class="btn" data-nav="${-step}" aria-label="前へ">←</button><button class="btn" data-nav="${step}" aria-label="次へ">→</button><button class="btn" data-sgoto>今日</button><strong style="margin-left:6px">${title}</strong></div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button class="chip-btn pref" data-sskip aria-pressed="${opts.showSkipped === true}" title="「参加しない」にした会議を、カレンダーに出したり隠したりします">参加しない会議</button><button class="btn" data-mtgadd>＋ 会議を追加</button><div class="seg" role="group" aria-label="表示"><button data-sview="week" aria-pressed="${view === "week"}">週</button><button data-sview="day" aria-pressed="${view === "day"}">日</button></div></div></div>
    <div class="summary"><span>実績 <b class="mono">${hours.toFixed(1)}時間</b></span><span>予定 <b class="mono">${planned}件</b></span>${unconf ? `<span class="pill wait">未確認 ${unconf}件（作業枠 ${unconfS}・会議 ${unconfM}）</span><button class="btn" data-confirmall>未確認をすべて実績にする</button>` : ""}<button class="btn danger" data-delsel ${delOk ? "" : "disabled"}>${delLabel}</button></div>`;
  return `<div class="cols${opts.showPrio === false ? " one" : ""}"><section class="panel">${nav}<div id="mtgslot">${meetingForm(data, { mtgDraft: opts.mtgDraft, selMtg: selMtg?.id })}</div><div id="calslot">${renderCalendar(data, today, calOpts)}</div></section>${renderSideToggle(opts.showPrio !== false)}${opts.showPrio === false ? "" : renderSide(data, today, { sched: true, picked: opts.picked, pendingDone: opts.pendingDone })}</div>`;
}


return { snapStart, weekStartOf, calendarGeometry, renderCalendar, renderSchedule };
})();

/* src/ui/views/workload.js */
const { renderWorkload, shiftWorkloadDate } = (() => {
// 「稼働」画面: 期間（週・月）ごとに、プロジェクト別のタスク（実績の作業枠）と会議（確認済み・参加するもの）の時間を見せる。




const h = (v) => `${v.toFixed(1)}h`;

/**
 * @param opts.period "week" | "month"
 * @param opts.date   表示する日（その日を含む週・月）
 * @param opts.now    {date, time} 未確認の件数を数えるための現在時刻
 */
function renderWorkload(data, today, opts = {}) {
  const { period = "week", date = today, now } = opts;
  const range = periodRange(period, date);
  const w = workload(data, range, now);
  const [y, m] = date.split("-").map(Number);
  const title = period === "week" ? `${fmtMD(range.start)}〜${fmtMD(range.end)} の週` : `${y}年${m}月`;
  const todayLabel = period === "week" ? "今週" : "今月";
  const max = Math.max(0, ...w.rows.map((r) => r.total), w.unassigned);
  const bar = (task, meeting) => {
    const total = task + meeting;
    const width = max ? (total / max) * 100 : 0;
    const tp = total ? (task / total) * 100 : 0;
    return `<div class="wl-bar" style="width:${width.toFixed(1)}%"><i class="t" style="width:${tp.toFixed(1)}%"></i><i class="m" style="width:${(100 - tp).toFixed(1)}%"></i></div>`;
  };
  const rows = w.rows.map((r) => `<tr><td>${esc(data.projects.find((p) => p.id === r.projectId)?.name ?? r.projectId)}</td><td class="num mono">${h(r.task)}</td><td class="num mono">${h(r.meeting)}</td><td class="num mono"><b>${h(r.total)}</b></td><td>${bar(r.task, r.meeting)}</td></tr>`).join("");
  const un = w.unassigned > 0
    ? `<tr class="muted"><td>プロジェクト未設定の会議</td><td class="num mono">—</td><td class="num mono">${h(w.unassigned)}</td><td class="num mono"><b>${h(w.unassigned)}</b></td><td><div class="wl-bar un" style="width:${(max ? (w.unassigned / max) * 100 : 0).toFixed(1)}%"><i class="m" style="width:100%"></i></div></td></tr>`
    : "";
  const sumTask = w.rows.reduce((a, r) => a + r.task, 0);
  const sumMtg = w.rows.reduce((a, r) => a + r.meeting, 0) + w.unassigned;
  const note = w.unconfirmed > 0
    ? `<div class="banner">未確認 ${w.unconfirmed}件（作業枠 ${w.unconfirmedTasks}・会議 ${w.unconfirmedMeetings}）は、まだ含まれていません。スケジュール画面で「実績にする」と確認すると加わります。</div>`
    : "";
  const none = data.projects.length ? "" : `<p class="muted">プロジェクトがありません。ガントチャートかリストの「＋ プロジェクトを追加」から追加してください。</p>`;
  return `<section class="panel wl" aria-label="稼働">
    <div class="toolbar"><div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"><button class="btn" data-wnav="-1" aria-label="前へ">←</button><button class="btn" data-wnav="1" aria-label="次へ">→</button><button class="btn" data-wtoday>${todayLabel}</button><strong style="margin-left:6px">${title}</strong></div>
      <div class="seg" role="group" aria-label="期間"><button data-wperiod="week" aria-pressed="${period === "week"}">週</button><button data-wperiod="month" aria-pressed="${period === "month"}">月</button></div></div>
    <div class="legend"><span><i class="sw wl-t"></i>タスク（実績の作業枠）</span><span><i class="sw wl-m"></i>会議（確認済み・参加するもの）</span></div>
    ${none}
    <div class="tscroll"><table class="tbl wl-tbl"><thead><tr><th>プロジェクト</th><th class="num">タスク</th><th class="num">会議</th><th class="num">合計</th><th>内訳</th></tr></thead><tbody>${rows}${un}</tbody>
      <tfoot><tr><td>合計</td><td class="num mono">${h(sumTask)}</td><td class="num mono">${h(sumMtg)}</td><td class="num mono">${h(w.total)}</td><td></td></tr></tfoot></table></div>
    ${note}
  </section>`;
}

/** 期間を 1 つ前後へ動かした日（週は 7 日、月は 1 か月） */
function shiftWorkloadDate(period, date, dir) {
  if (period === "week") return addDays(date, 7 * dir);
  const [y, m] = date.split("-").map(Number);
  const t = y * 12 + (m - 1) + dir;
  return `${String(Math.floor(t / 12)).padStart(4, "0")}-${String((t % 12) + 1).padStart(2, "0")}-01`;
}

return { renderWorkload, shiftWorkloadDate };
})();

/* src/ui/views/settings.js */
const { settingsInputValues, renderSettings } = (() => {
// 「設定」タブ: 基本の設定（営業日の数え方・勤務時間・待ち長期化の日数・見出しの呼び名）と、休みと営業日（日本の祝日（表示のみ）・休み（手動）・営業日として扱う日）と、キーワード規則（会議名。編集できる）と、WBS の取り込み記録（表示のみ）。節は折りたため、閉じている節は opts.closed で渡す。






/** 基本の設定の入力に出す値。形が違う・無い項目は既定値（画面の描画と、不正な入力を元に戻すときに使う） */
function settingsInputValues(data) {
  const st = data.settings ?? {};
  const ok = st.workday && isTime(st.workday.start) && isTime(st.workday.end) && toMin(st.workday.start) < toMin(st.workday.end);
  const wd = ok ? st.workday : DEFAULT_WORKDAY;
  const lb = groupLabels(st);
  return { workdayStart: wd.start, workdayEnd: wd.end, waitingLongDays: Number.isInteger(st.waitingLongDays) && st.waitingLongDays >= 1 ? st.waitingLongDays : 7, labelGroup: lb.group, labelSubgroup: lb.subgroup };
}

/** @param opts.ruleError  規則の追加・書き換えで出たエラーの文言
 *  @param opts.closed     閉じている節の ID の配列（prefs.js の SETTINGS_FOLDS）。省略はすべて開く */
function renderSettings(data, today, opts = {}) {
  const projects = data.projects ?? [];
  const rules = data.settings?.projectRules ?? [];
  const counts = ruleMeetingCounts(data);
  const closed = opts.closed ?? [];
  /** 折りたためる節。見出し（h）は summary の中に置く。ID は prefs.js の SETTINGS_FOLDS。閉じていて注意（n 件）があるときは、見出しに件数を出す */
  const fold = (id, cls, h, title, body, n = 0) => `<details class="${cls}" data-fold="${id}" aria-labelledby="h-${id}"${closed.includes(id) ? "" : " open"}><summary><${h} id="h-${id}">${title}</${h}>${closed.includes(id) && n ? `<span class="note err">注意 ${n} 件</span>` : ""}</summary>${body}</details>`;
  const options = (sel) => projects.map((p) => `<option value="${esc(p.id)}"${p.id === sel ? " selected" : ""}>${esc(p.name)}</option>`).join("");

  // 基本の設定: 値は settings の値。形が違う項目（validate の注意が出る項目）は、既定値を出して、横に注意を出す
  const warns = validate(data).warnings.filter((m) => m.startsWith("settings."));
  const warnOf = (key) => warns.filter((m) => m.startsWith(`settings.${key}:`)).map((m) => `<div class="note err">${esc(m)}</div>`).join("");
  const warnN = (...keys) => warns.filter((m) => keys.some((k) => m.startsWith(`settings.${k}:`))).length;
  const st = data.settings ?? {};
  const countOn = st.countWeekendsAndHolidays === true; // 土日祝を営業日に数える。true 以外（"true" など）はオフ
  const iv = settingsInputValues(data);
  const basic = fold("basic", "panel fold", "h2", "基本の設定", `
      <p class="note" style="margin:0 0 10px">変更はその場でファイルに保存されます。</p>
      <div class="tscroll"><table class="tbl edit"><tbody>
        <tr><td data-l="項目">営業日の数え方</td><td data-l="値"><label><input type="checkbox" data-set="countWeekendsAndHolidays" aria-label="土日祝を営業日に数える"${countOn ? " checked" : ""}> 土日祝を営業日に数える</label>${warnOf("countWeekendsAndHolidays")}</td><td class="muted" data-l="説明">日数の計算（営業日後の期限）とスケジュールの作業枠で、土日と日本の祝日を飛ばすかどうかを選びます。オンにしても、手動の休みは飛ばします。</td></tr>
        <tr><td data-l="項目">勤務時間</td><td data-l="値"><input class="in" type="time" data-set="workday-start" value="${esc(iv.workdayStart)}" aria-label="勤務時間の開始"> 〜 <input class="in" type="time" data-set="workday-end" value="${esc(iv.workdayEnd)}" aria-label="勤務時間の終了">${warnOf("workday")}</td><td class="muted" data-l="説明">スケジュールで作業枠を置ける範囲です。</td></tr>
        <tr><td data-l="項目">待ち長期化の日数</td><td data-l="値"><input class="in" type="number" min="1" step="1" data-set="waitingLongDays" value="${iv.waitingLongDays}" aria-label="待ち長期化とみなす日数"> 日${warnOf("waitingLongDays")}</td><td class="muted" data-l="説明">Waiting がこの日数を超えると、「今日の優先」と遅延バッジに出ます。</td></tr>
        <tr><td data-l="項目">見出しの呼び名</td><td data-l="値"><input class="in" data-set="label-group" value="${esc(iv.labelGroup)}" aria-label="大項目の呼び名"> <input class="in" data-set="label-subgroup" value="${esc(iv.labelSubgroup)}" aria-label="中項目の呼び名">${warnOf("labels")}</td><td class="muted" data-l="説明">ガント・リストの見出しの呼び名です。空にすると既定（大項目・中項目）に戻ります。</td></tr>
      </tbody></table></div>`, warnN("countWeekendsAndHolidays", "workday", "waitingLongDays", "labels"));

  // 休みと営業日の指定: 形が違う要素は出さず（validate の注意が節の上に出る）、日付の昇順で並べる
  const entries = (v) => (Array.isArray(v) ? v.filter((x) => x && typeof x === "object" && isDate(x.date)) : []).slice().sort((p, q) => p.date.localeCompare(q.date));
  const noteTd = (x) => `<td class="muted" data-l="メモ">${x.note ? esc(x.note) : ""}</td>`;
  const nh = st.nationalHolidays, nhDates = entries(nh?.dates);
  const nhRows = nhDates.filter((x) => x.date >= today).slice(0, 12).map((x) => `<tr><td class="mono" data-l="日付">${esc(x.date)}</td><td data-l="名称">${esc(x.name ?? "")}</td></tr>`).join("");
  const nationalSec = fold("nat", "subfold", "h3", "日本の祝日", `
      <p class="note" style="margin:0 0 10px">営業日の計算で飛ばす日です。内閣府の祝日一覧から、Claude Code が取得して保存します（営業日を使う提案を作るときと、見張りを始めるときに、自動で更新します。この画面からは取得しません）。</p>
      ${countOn ? `<p class="muted" style="margin:0 0 8px">いまは土日祝を営業日に数える設定なので、この一覧は日数計算に使いません。</p>` : ""}
      ${warnOf("nationalHolidays")}
      ${nh && typeof nh === "object" && isDate(nh.fetchedAt) && nhDates.length
        ? `<p style="margin:0 0 8px">取得日 <span class="mono">${esc(nh.fetchedAt)}</span>・<span class="mono">${nhDates.length} 件</span>（<span class="mono">${esc(nhDates[0].date)}〜${esc(nhDates.at(-1).date)}</span>）。今日以降の祝日:</p>
         ${nhRows ? `<div class="tscroll"><table class="tbl"><tbody>${nhRows}</tbody></table></div>` : `<p class="muted" style="margin:0">今日以降の祝日は、取得した範囲にありません。次に自動で更新されます。</p>`}`
        : `<p class="muted" style="margin:0">まだ取得していません。営業日を使う提案を作るときと、見張りを始めるときに、自動で取得します。</p>`}
    `, warnN("nationalHolidays"));

  const kindOptions = (cur) => HOLIDAY_KINDS.concat(HOLIDAY_KINDS.includes(cur) || cur === undefined ? [] : [cur]).map((k) => `<option${k === (cur ?? HOLIDAY_KINDS[0]) ? " selected" : ""}>${esc(k)}</option>`).join("");
  const holidayRows = entries(st.holidays).map((x) => `<tr><td class="mono" data-l="日付">${esc(x.date)}</td><td data-l="区分"><select class="in sm" data-hrowkind="${esc(x.date)}" aria-label="${esc(x.date)} の区分">${kindOptions(x.kind)}</select></td>${noteTd(x)}<td data-l=""><button class="btn" data-hdel="${esc(x.date)}" aria-label="${esc(x.date)} を休みから外す">削除</button></td></tr>`).join("");
  const holidaySec = fold("hol", "subfold", "h3", "休み（手動）", `
      <p class="note" style="margin:0 0 10px">有給・会社独自の休みなどを登録します。営業日の計算で飛ばします（区分は整理用で、計算は同じです）。${countOn ? "終了日を入れると期間として登録します。土日祝を営業日に数えるときは、期間内の土日と日本の祝日も除きません。" : "終了日を入れると期間として登録し、期間内の土日と日本の祝日は除きます。"}変更はその場でファイルに保存されます。</p>
      ${warnOf("holidays")}
      <div class="tscroll"><table class="tbl edit"><thead><tr><th>日付</th><th>区分</th><th>メモ</th><th></th></tr></thead><tbody>${holidayRows || `<tr><td colspan="4" class="muted">休みは登録されていません。下の行から追加します。</td></tr>`}
        <tr><td data-l="日付"><input class="in" type="date" data-hnew aria-label="休みの開始日"> 〜 <input class="in" type="date" data-hto aria-label="休みの終了日（期間のとき）"></td><td data-l="区分"><select class="in sm" data-hkind aria-label="追加する休みの区分">${kindOptions()}</select></td><td data-l="メモ"><input class="in" data-hnote placeholder="メモ（任意）" aria-label="休みのメモ"></td><td data-l=""><button class="btn" data-hadd>＋ 追加</button></td></tr></tbody></table></div>
    `, warnN("holidays"));

  const workdayRows = entries(st.workdays).map((x) => `<tr><td class="mono" data-l="日付">${esc(x.date)}</td>${noteTd(x)}<td data-l=""><button class="btn" data-wdel="${esc(x.date)}" aria-label="${esc(x.date)} を営業日の指定から外す">削除</button></td></tr>`).join("");
  const workdaySec = fold("wrk", "subfold", "h3", "営業日として扱う日", `
      <p class="note" style="margin:0 0 10px">土日・祝日・休みでも、この日は営業日として数えます（休日出勤など）。変更はその場でファイルに保存されます。</p>
      ${warnOf("workdays")}
      <div class="tscroll"><table class="tbl edit"><thead><tr><th>日付</th><th>メモ</th><th></th></tr></thead><tbody>${workdayRows || `<tr><td colspan="3" class="muted">営業日の指定はありません。下の行から追加します。</td></tr>`}
        <tr><td data-l="日付"><input class="in" type="date" data-wnew aria-label="営業日として扱う日"></td><td data-l="メモ"><input class="in" data-wnote placeholder="メモ（任意）" aria-label="営業日の指定のメモ"></td><td data-l=""><button class="btn" data-wadd>＋ 追加</button></td></tr></tbody></table></div>
    `, warnN("workdays"));

  const ruleRows = rules.map((r, i) => {
    const known = projects.some((p) => p.id === r.projectId);
    const unknown = known ? "" : `<option value="${esc(r.projectId)}" selected>（不明: ${esc(r.projectId)}）</option>`;
    const k = esc(r.keyword);
    return `<tr><td data-l="キーワード"><input class="in" data-rkw="${k}" data-ri="${i}" value="${k}" aria-label="キーワード ${k}"></td>
      <td data-l="プロジェクト"><select class="in" data-rpj="${k}" data-ri="${i}" aria-label="${k} のプロジェクト">${unknown}${options(r.projectId)}</select></td>
      <td class="mono" data-l="付いている会議" data-rcount>${counts[i]} 件</td>
      <td data-l=""><button class="btn" data-rmove="${k}|-1" aria-label="${k} を上へ"${i === 0 ? " disabled" : ""}>↑</button> <button class="btn" data-rmove="${k}|1" aria-label="${k} を下へ"${i === rules.length - 1 ? " disabled" : ""}>↓</button> <button class="btn" data-rdel="${k}" aria-label="${k} の規則を削除">削除</button></td></tr>`;
  }).join("");
  const empty = rules.length ? "" : `<tr><td colspan="4" class="muted">規則はありません。下の行から追加します。</td></tr>`;
  const addRow = `<tr><td data-l="キーワード"><input class="in" data-rnew placeholder="件名に含むキーワード" aria-label="追加するキーワード"></td>
      <td data-l="プロジェクト"><select class="in" data-rnewpj aria-label="追加する規則のプロジェクト">${options(projects[0]?.id)}</select></td>
      <td data-l=""></td><td data-l=""><button class="btn" data-radd ${projects.length ? "" : "disabled"}>＋ 追加</button></td></tr>`;

  const imports = data.settings?.wbsImports ?? {};
  const wbsRows = projects.map((p) => {
    const w = imports[p.id];
    return w
      ? `<tr><td data-l="プロジェクト">${esc(p.name)}</td><td data-l="ファイル">${w.file ? esc(w.file) : `<span class="muted">（不明）</span>`}</td><td class="mono" data-l="日付">${esc(w.at)}</td><td class="mono" data-l="追加">${w.added} 件</td><td class="mono" data-l="更新">${w.updated} 件</td></tr>`
      : `<tr><td data-l="プロジェクト">${esc(p.name)}</td><td colspan="4" class="muted" data-l="ファイル">記録なし</td></tr>`;
  }).join("");

  const days = fold("days", "panel fold", "h2", "休みと営業日", `
      <div class="subfolds">${nationalSec}${holidaySec}${workdaySec}</div>`, warnN("nationalHolidays", "holidays", "workdays"));
  const rulesSec = fold("rules", "panel fold", "h2", "キーワード規則（会議名）", `
      <p class="note" style="margin:0 0 10px">件名にキーワードを含む会議を、そのプロジェクトに付けます。上の規則が先に当たります。手動で付けた会議は、規則を変えても変わりません。変更はその場でファイルに保存されます。</p>
      ${opts.ruleError ? `<p class="note err" role="alert" style="margin:0 0 10px">${esc(opts.ruleError)}</p>` : ""}
      <div class="tscroll"><table class="tbl edit"><thead><tr><th>キーワード</th><th>プロジェクト</th><th>付いている会議</th><th></th></tr></thead><tbody>${ruleRows}${empty}${addRow}</tbody></table></div>`, opts.ruleError ? 1 : 0);
  const wbsSec = fold("wbs", "panel fold", "h2", "WBS の取り込み記録", `
      <p class="note" style="margin:0 0 10px">プロジェクトごとに、最後に取り込んだ WBS です（追加か更新があった取り込みを、Claude Code が自動で記録します。変更がなかった取り込みは記録しません）。</p>
      ${projects.length ? `<div class="tscroll"><table class="tbl"><thead><tr><th>プロジェクト</th><th>ファイル</th><th>日付</th><th>追加</th><th>更新</th></tr></thead><tbody>${wbsRows}</tbody></table></div>` : `<p class="muted" style="margin:0">プロジェクトがありません。</p>`}`);

  return `<div style="display:flex;flex-direction:column;gap:16px">${basic}${days}${rulesSec}${wbsSec}</div>`;
}

return { settingsInputValues, renderSettings };
})();

/* src/ui/views/inboxpanel.js */
const { ibExamples, renderInboxBar } = (() => {
// 画面下端の「Claude Code に依頼する」の帯と引き出し（依頼の入力・履歴・提案のカード）。描画のみで、副作用はない。
// 属性: 開閉 data-ib-toggle / 対象 data-ib-project / 入力 data-ib-text / 例 data-ib-example / 送信 data-ib-send /
//       提案 data-ib-reason・data-ib-cause・data-ib-approve・data-ib-reply・data-ib-replysend・data-ib-reject（処理待ち・処理中にも出す）/ 再提案 data-ib-retry（値は依頼の ID）





const STATUS = {
  pending: ["送信済み", "wait"], working: ["処理中", "wait"], question: ["聞き返しがあります", "warn"], proposed: ["提案があります", "ok"],
  applied: ["反映済み", "done"], rejected: ["却下", "off"], failed: ["失敗", "bad"],
};
const EXAMPLES = [["due", "期限が動いた"], ["add", "タスクを登録"]];

/** 「書き方の例」で入る文。対象のプロジェクト（空なら先頭のタスクのプロジェクト）の、終わっていないタスクの ID を使う（なければ終わったもの、タスクが 0 件のときだけ A1）。
 *  別のプロジェクトの ID を混ぜない（依頼が「別のプロジェクトです」で失敗する）。登録の期限の例は、今日の 14 日後 */
function ibExamples(data, projectId, today) {
  const all = data?.tasks ?? [];
  const pid = projectId || all[0]?.projectId;
  const pool = all.filter((t) => t.projectId === pid);
  const ids = [...pool.filter((t) => t.status !== "Done"), ...pool.filter((t) => t.status === "Done")].map((t) => t.id);
  const a = ids[0] ?? "A1";
  return {
    due: `${a} が 5 日遅れた（原因: ベンダー）。`,
    add: `次を登録して: 結合テスト ${addDays(today, 14)} 大項目▸中項目 前のタスク ${a}`,
  };
}

const two = (n) => String(n).padStart(2, "0");
/** ISO 日時 → 「10/21 14:32」（この端末の時刻） */
function fmtAt(iso) {
  const d = new Date(iso);
  return Number.isNaN(d.getTime()) ? "" : `${two(d.getMonth() + 1)}/${two(d.getDate())} ${two(d.getHours())}:${two(d.getMinutes())}`;
}

function sectionHtml(s) {
  if (s.kind === "due") {
    const rows = s.rows.map((r) => `<tr><td class="id">${esc(r.taskId)}</td><td>${esc(r.title)}</td><td class="mono">${fmtMD(r.oldDue)}</td><td class="mono"><b>${fmtMD(r.newDue)}</b></td><td>${esc(r.reason)}</td></tr>`).join("");
    return `<div class="ib-sec"><b>期限の変更（${s.rows.length} 件）</b><table class="tbl"><thead><tr><th>ID</th><th>件名</th><th>旧期限</th><th>新期限</th><th>理由</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }
  if (s.kind === "add") {
    const rows = s.rows.map((r, i) => `<tr data-row="${i + 1}"><td class="mono">${i + 1}</td><td>${esc(r.title)}${(r.checklist ?? []).length ? ` <span class="muted">（項目 ${r.checklist.length} 件）</span>` : ""}</td><td>${r.group ? esc(r.group) : "（なし）"}${r.subgroup ? ` ▸ ${esc(r.subgroup)}` : ""}</td><td class="mono">${esc(r.businessDays ?? "—")}</td><td class="mono">${fmtMD(r.due)}</td><td class="mono">${(r.predecessors ?? []).length ? esc(r.predecessors.join(", ")) : "—"}</td></tr>`).join("");
    return `<div class="ib-sec"><b>タスクの登録（${s.rows.length} 件）</b><table class="tbl"><thead><tr><th>#</th><th>件名</th><th>大項目 ▸ 中項目</th><th>営業日</th><th>期限</th><th>前のタスク</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }
  return "";
}

const threadHtml = (r) => r.thread.slice(1).map((m) => `<div class="ib-msg ${m.role}"><span class="muted">${m.role === "user" ? "あなた" : "Claude Code"}</span> ${esc(m.text)}</div>`).join("");

function detailHtml(data, r, ui) {
  if (r.status === "proposed" && r.proposal) {
    const p = r.proposal;
    const reason = ui.reasons?.[r.id] ?? p.reason ?? "";
    const cause = ui.causes?.[r.id] ?? p.cause ?? "その他";
    const warns = (p.warnings ?? []).map((w) => `<div class="ib-warn">${esc(w)}</div>`).join("");
    return `<div class="ib-card">${threadHtml(r)}${p.sections.map((s) => sectionHtml(s)).join("")}${warns}
      <div class="ib-ctl"><label>原因<select class="in" data-ib-cause="${esc(r.id)}" aria-label="原因">${CAUSES.map((c) => `<option${c === cause ? " selected" : ""}>${esc(c)}</option>`).join("")}</select></label>
      <label style="flex:1 1 220px">変更履歴に残す理由<input class="in" data-ib-reason="${esc(r.id)}" value="${esc(reason)}" aria-label="変更履歴に残す理由"></label></div>
      <div class="ib-act"><button class="btn primary" data-ib-approve="${esc(r.id)}">承認して反映する</button><button class="btn" data-ib-reject="${esc(r.id)}">却下する</button></div>
      <div class="ib-ctl"><input class="in" data-ib-reply="${esc(r.id)}" value="${esc(ui.replies?.[r.id] ?? "")}" placeholder="修正の依頼（例: A5 は 5 営業日にして）" aria-label="修正の依頼" style="flex:1 1 240px"><button class="btn warm" data-ib-replysend="${esc(r.id)}">修正を依頼する</button></div></div>`;
  }
  if (r.status === "pending" || r.status === "working") {
    // 見張りが止まって、受け取られない・処理が止まった依頼を、画面から取り下げられるようにする
    return `<div class="ib-card">${threadHtml(r)}<div class="ib-act"><button class="btn" data-ib-reject="${esc(r.id)}">却下する</button></div></div>`;
  }
  if (r.status === "question") {
    return `<div class="ib-card">${threadHtml(r)}<div class="ib-ctl"><input class="in" data-ib-reply="${esc(r.id)}" value="${esc(ui.replies?.[r.id] ?? "")}" placeholder="返信" aria-label="返信" style="flex:1 1 240px"><button class="btn primary" data-ib-replysend="${esc(r.id)}">返信する</button></div></div>`;
  }
  if (r.status === "failed") {
    return `<div class="ib-card">${threadHtml(r)}<div class="ib-act"><button class="btn" data-ib-retry="${esc(r.id)}">もう一度提案してもらう</button></div></div>`;
  }
  if (r.status === "applied" && r.result) {
    return `<div class="ib-card muted">${esc(r.result.summary)}（${r.result.by === "claude" ? "Claude Code で承認" : "この画面で承認"}）</div>`;
  }
  return "";
}

/**
 * @param ui { open, canWrite, nowMs, text, projectId, replies, reasons, causes }  text は入力の下書き、projectId は対象（""＝すべて）
 */
function renderInboxBar(data, ui) {
  if (!ui.canWrite) {
    return `<div class="ib ib-off"><div class="ib-bar"><b>Claude Code に依頼する</b><span class="ib-hint">この機能には、ファイルへの直接保存が必要です（Edge か Chrome で、データファイルを開いて使います）</span></div></div>`;
  }
  const reqs = data.inbox?.requests ?? [];
  const proposed = reqs.filter((r) => r.status === "proposed").length;
  const watching = isWatching(data, ui.nowMs);
  const state = `<span class="ib-state ${watching ? "on" : "off"}"><i></i>${watching ? "Claude Code が見ています" : "Claude Code が見ていません"}</span>`;
  const badge = proposed ? `<span class="ib-badge">提案が ${proposed} 件届いています</span>` : "";
  const head = `<div class="ib-bar"><button class="ib-toggle" data-ib-toggle aria-expanded="${ui.open}">${ui.open ? "▼ 閉じる" : "▲ 開く"}</button><b>Claude Code に依頼する</b>${ui.open ? "" : `<span class="ib-hint">「A3 が 5 日遅れた」「このタスクを登録して」など</span>`}<span class="ib-sp"></span>${badge}${state}</div>`;
  if (!ui.open) return `<div class="ib">${head}</div>`;

  const projects = data.projects ?? [];
  const select = `<select class="in" data-ib-project aria-label="対象のプロジェクト"><option value="">すべて</option>${projects.map((p) => `<option value="${esc(p.id)}"${p.id === ui.projectId ? " selected" : ""}>${esc(p.name)}</option>`).join("")}</select>`;
  const examples = EXAMPLES.map(([k, l]) => `<button class="ib-ex" data-ib-example="${k}">${l}</button>`).join("");
  const history = [...reqs].reverse().map((r) => {
    const [label, tone] = STATUS[r.status] ?? [r.status, "off"];
    const proj = r.projectId ? (projects.find((p) => p.id === r.projectId)?.name ?? r.projectId) : "すべて";
    return `<li class="ib-req" data-ib-req="${esc(r.id)}" data-status="${esc(r.status)}"><div class="ib-rh"><span class="mono muted">${esc(fmtAt(r.at))}</span><span class="pill ${tone}">${label}</span><span class="muted">対象: ${esc(proj)}</span></div><div class="ib-rt">${esc(r.thread[0]?.text ?? "")}</div>${detailHtml(data, r, ui)}</li>`;
  }).join("");
  const hint = watching ? "" : `<div class="ib-note">Claude Code が見ていないようです。Claude Code で <span class="mono">/project-board:watch</span> を実行すると、依頼を受け取ります。</div>`;
  return `<div class="ib open">${head}<section class="ib-drawer" role="dialog" aria-label="Claude Code に依頼する"><div class="ib-body">
    <div class="ib-compose"><div class="ib-row"><label>対象 ${select}</label><span class="muted">書き方の例（押すと入ります）:</span>${examples}</div>
      <label for="ib-text" class="muted">依頼（文章で。複数の種類を、まとめて書いても構いません）</label>
      <textarea id="ib-text" class="in" data-ib-text rows="7">${esc(ui.text)}</textarea>
      <div class="ib-row"><button class="btn primary" data-ib-send>依頼を送る</button><span class="muted">送ると、依頼がファイルに書かれます。承認するまで、タスクは変わりません。</span></div>${hint}</div>
    <div class="ib-hist"><div class="muted">これまでの依頼</div>${history ? `<ul class="ib-reqs">${history}</ul>` : `<p class="muted" style="margin:6px 0">まだ依頼はありません。</p>`}</div>
  </div></section></div>`;
}

return { ibExamples, renderInboxBar };
})();

/* src/ui/views/checklist.js */
const { checklistEditorHtml } = (() => {
// チェックリストの編集欄（リストの展開行と、ガントの編集の窓が共用）。
// 属性（data-ck*）は app.js のイベントが読む: data-ckbox（タスク）・data-ckid（項目の行）・data-ckmv（並び替えの取っ手）・
//   data-ckdone（チェック）・data-cktext（文言）・data-ckdel（削除）・data-ckadd（追加欄）。値は「タスクID|項目ID」。



function checklistEditorHtml(t) {
  const id = esc(t.id);
  const rows = checklistOf(t).map((c) => {
    const key = `${id}|${esc(c.id)}`;
    return `<div class="ck-row" data-ckid="${esc(c.id)}"><span class="mv" draggable="true" data-ckmv="${key}" title="ドラッグで並べ替え" aria-label="${esc(c.text)} を並べ替え">⠿</span><input type="checkbox" data-ckdone="${key}"${c.done ? " checked" : ""} aria-label="済み"><input class="in${c.done ? " done" : ""}" data-cktext="${key}" value="${esc(c.text)}" aria-label="項目"><button class="gx" data-ckdel="${key}" aria-label="${esc(c.text)} を削除">×</button></div>`;
  }).join("");
  return `<div class="ckedit" data-ckbox="${id}"><div class="ck-head"><b>チェックリスト</b> ${checkMeterHtml(t)}</div>${rows}<div class="ck-add"><input class="in" data-ckadd="${id}" placeholder="項目を追加（Enter で追加）" aria-label="項目を追加"></div></div>`;
}

return { checklistEditorHtml };
})();

/* src/ui/views/taskpop.js */
const { predEditHtml, startInputHtml, renderTaskPop } = (() => {
// ガントチャートでタスク名・バーをクリックしたときに開く、編集の小さな窓。
// 入力の属性（data-f・data-id・data-addpre・data-rmpre）は、リストの編集欄と同じ。保存と描き直しは、リストと同じ処理が受け持つ。
// 窓を閉じる ×: data-tpopclose / 窓: data-tpop。「リストで開く」は data-goto、削除は data-del（どちらも既存の処理）





/** 前のタスクの外し方（×）と足し方（選択）。リストの編集欄と共用 */
function predEditHtml(data, t) {
  const chips = (t.predecessors ?? []).map((id) => `<span class="chip">${esc(id)}<button data-rmpre="${esc(t.id)}|${esc(id)}" aria-label="${esc(id)} を前のタスクから外す">×</button></span>`).join("");
  const cand = predecessorCandidates(data, t.id).map((id) => data.tasks.find((u) => u.id === id));
  const add = cand.length ? `<select class="in sm" data-addpre="${esc(t.id)}" aria-label="前のタスクを追加"><option value="">＋前のタスク</option>${cand.map((u) => `<option value="${esc(u.id)}">${esc(u.id)} ${esc(u.title)}</option>`).join("")}</select>` : "";
  return `<div class="chips">${chips}${add}</div>`;
}

/** 開始日の入力。指定がなく前のタスクがあるときは、前のタスクの期限から決まる日を入れて「前のタスクから」と添える（空にすると指定を外す） */
function startInputHtml(data, t) {
  const derived = !t.start && (t.predecessors ?? []).length > 0;
  const hint = derived ? ` <small class="muted" title="開始日を指定していないので、前のタスクの期限から決まります">前のタスクから</small>` : "";
  return `<input class="in" type="date" data-f="start" data-id="${esc(t.id)}" value="${esc(t.start || (derived ? taskStart(data, t.id) : ""))}" aria-label="${esc(t.id)} の開始日">${hint}`;
}

/**
 * @param pop { id, x, y }  クリックした位置（画面の座標）。置き場所の調整は呼び出し側（画面の端に収める）
 * @param statusHtml 状態の欄（リストと同じ。待ち先・Done の確認の表示を含む）
 */
function renderTaskPop(data, pop, statusHtml) {
  const t = data.tasks.find((x) => x.id === pop.id);
  if (!t) return "";
  const id = esc(t.id);
  const field = (label, inner) => `<label class="tp-f"><span class="muted">${label}</span>${inner}</label>`;
  const importance = [["", "—"], ["high", "高"]].map(([v, l]) => `<option value="${v}" ${(t.importance ?? "") === v ? "selected" : ""}>${l}</option>`).join("");
  return `<div class="tpop" role="dialog" aria-label="${id} を編集" data-tpop style="left:${Math.round(pop.x)}px;top:${Math.round(pop.y)}px">
    <div class="tp-h"><b class="mono">${id}</b><span class="muted">${fmtMD(taskStart(data, t.id))}〜${fmtMD(t.due)}</span><button class="gx" data-tpopclose aria-label="編集を閉じる" style="opacity:1">×</button></div>
    ${field("件名", `<input class="in" data-f="title" data-id="${id}" value="${esc(t.title)}">`)}
    <div class="tp-f"><span class="muted">状態</span><div>${statusHtml}</div></div>
    <div class="tp-r">${field("開始", startInputHtml(data, t))}${field("期限", `<input class="in" type="date" data-f="due" data-id="${id}" value="${esc(t.due)}">`)}</div>
    ${checklistEditorHtml(t)}
    <div class="tp-f"><span class="muted">前のタスク</span>${predEditHtml(data, t)}</div>
    <div class="tp-r">${field("重要度", `<select class="in sm" data-f="importance" data-id="${id}">${importance}</select>`)}</div>
    ${field("メモ", `<input class="in" data-f="memo" data-id="${id}" value="${esc(t.memo ?? "")}" placeholder="メモ">`)}
    <div class="tp-a"><button class="btn" data-goto="${id}">リストで開く</button><button class="btn danger" data-del="${id}">削除</button></div>
  </div>`;
}

return { predEditHtml, startInputHtml, renderTaskPop };
})();

/* src/ui/views/project.js */
const { renderProjects } = (() => {
// プロジェクト画面: 絞り込み × ガント／リスト、右に「今日のタスク」「今日の優先」












const actText = (data, id) => {
  const a = taskActual(data, id);
  return a.count ? `${a.hours.toFixed(1)}h${a.firstDate ? "・初回 " + fmtMD(a.firstDate) : ""}・${a.count}回` : "—";
};

/** 状態の欄（選択。待ち先の入力・Done の確認が出ているときは、その表示）。リストとガントの編集の窓で共用 */
function statusCellHtml(t, opts, late) {
  const id = esc(t.id);
  if (opts.pendingWait === t.id) {
    return `<div class="ask" style="max-width:none">待ち先を入力<input class="in" data-waitparty="${id}" placeholder="ベンダー・部署名" aria-label="${id} の待ち先"><div style="display:flex;gap:6px;margin-top:4px"><button class="btn" data-waitok="${id}">Waiting にする</button><button class="btn" data-waitno>やめる</button></div></div>`;
  }
  if (opts.pendingDone?.id === t.id && !opts.todayIds?.has(t.id)) return doneAskHtml(opts.pendingDone);
  return `<select class="in" data-f="status" data-id="${id}" aria-label="${id} の状態">${TASK_STATUS.map((o) => `<option ${o === t.status ? "selected" : ""}>${o}</option>`).join("")}</select>${late ? ` <span class="pill late">期限超過</span>` : ""}`;
}

/** リストの「チェック」列。押すと、その行の下に編集欄が開く（開いているタスクは opts.checkOpen の Set） */
function checkCell(t, opts) {
  const { total, done } = checklistCount(t);
  const open = !!opts.checkOpen?.has(t.id);
  const label = total ? `${open ? "▾" : "▸"} ${done}/${total}` : "＋ 追加";
  return `<button class="ck-toggle${total ? "" : " ck-empty"}" data-cktoggle="${esc(t.id)}" aria-expanded="${open}" aria-label="${esc(t.id)} のチェックリスト">${label}</button>`;
}

function renderList(data, p, today, opts) {

      <td data-l="${esc(labels.group)}"><input class="in gi" data-f="group" data-id="${esc(t.id)}" value="${esc(t.group ?? "")}" aria-label="${esc(t.id)} の${esc(labels.group)}"></td>

      <td data-l="待ち先"><input class="in" data-f="party" data-id="${esc(t.id)}" value="${esc(t.waitingOn?.party ?? "")}" placeholder="${t.status === "Waiting" ? "ベンダー・部署名" : "—"}" ${t.status === "Waiting" ? "" : "disabled"} aria-label="${esc(t.id)} の待ち先">${needParty}</td>
      <td data-l="重要度"><select class="in sm" data-f="importance" data-id="${esc(t.id)}" aria-label="${esc(t.id)} の重要度">${[["", "—"], ["high", "高"]].map(([v, l]) => `<option value="${v}" ${(t.importance ?? "") === v ? "selected" : ""}>${l}</option>`).join("")}</select></td>
      <td data-l="メモ"><input class="in" data-f="memo" data-id="${esc(t.id)}" value="${esc(t.memo ?? "")}" placeholder="メモ" aria-label="${esc(t.id)} のメモ"></td>
      <td data-l="チェック">${checkCell(t, opts)}</td>

  };
  // (大項目, 中項目) ごとに見出し行を入れて並べる。「＋」はそのグループへ追加する入口なので、0 件でも「（なし）」を出す
  const secs = groupSections(tasks, { ensureNone: true });

  }).join("");

  const projTaskIds = new Set(tasks.map((t) => t.id));
  const log = data.changeLog.filter((l) => l.source == null || Number(l.deltaDays) !== 0).filter((l) => (l.taskIds ?? []).some((id) => projTaskIds.has(id)))
    .map((l) => `<li><span class="d">${fmtMD(l.at)}</span><span><span class="pill">${esc(l.cause ?? "—")}</span> ${esc(l.reason)} <span class="mono muted">(${esc((l.taskIds ?? []).join(", "))}・${Number(l.deltaDays) > 0 ? "+" : ""}${Number(l.deltaDays)}日)</span></span></li>`).join("")

    || '<p class="muted" style="margin:0">マイルストーンはありません。</p>';

  const delProj = opts.askDelProject === p.id

      <label>種別 <select class="in sm" data-pf="type" data-pid="${esc(p.id)}" aria-label="種別">${PROJECT_TYPE.map((o) => `<option ${o === p.type ? "selected" : ""}>${o}</option>`).join("")}</select></label>

      <label>期限 <input class="in sm" type="date" data-pf="due" data-pid="${esc(p.id)}" value="${esc(p.due)}" aria-label="${esc(p.name)} の期限"></label>
      <span>進捗 <b class="mono">${prog.done}/${prog.total}</b> (${Math.round(prog.rate * 100)}%)</span><span class="mono hrs">${(() => { const hh = projectHours(data, p.id); return `稼働 ${(hh.task + hh.meeting).toFixed(1)}h（タスク ${hh.task.toFixed(1)}h・会議 ${hh.meeting.toFixed(1)}h）`; })()}</span></div></div><div>${flagPills(data, p.id, today, projectFlags(data, p.id, today))}</div></div>
    </div><div class="twrap"><div class="thstrip" aria-hidden="true"></div><div class="tscroll tlist"><table class="tbl edit"><thead><tr><th>ID</th><th>${esc(labels.group)}</th><th>${esc(labels.subgroup)}</th><th>件名</th><th>状態</th><th>開始</th><th>期限</th><th>前のタスク</th><th>待ち先</th><th>重要度</th><th>メモ</th><th>チェック</th><th>実績</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></div>
    <div style="display:flex;gap:12px;align-items:center;margin-top:12px;flex-wrap:wrap"><span class="note">変更はその場でファイルに保存されます。次のタスクの日程をまとめて見直すときは、画面の下端の「Claude Code に依頼する」に頼みます。</span></div>
    <h2 style="margin:18px 0 8px;font-size:13px">マイルストーン</h2>
    <div class="mslist">${ms}<div><button class="btn" data-msadd="${esc(p.id)}">＋ マイルストーンを追加</button> <span class="note">ガントに◆で表示されます。</span></div></div>
    <h2 style="margin:18px 0 2px;font-size:13px">日程変更の履歴</h2><p class="note" style="margin:0 0 8px">日程が動いたとき、いつ・何が・なぜ動いたか(原因: ベンダー／社内／自分)の記録です。「Claude Code に依頼する」で期限の変更を反映したときに記録されます。画面で期限を直接変えたときは記録されません。</p><ul class="log">${log}</ul>
    <div style="margin-top:18px">${delProj}</div></section>`;
}

/**
 * @param opts.filter  "all" か projectId
 * @param opts.view    "gantt" | "list"
 * @param opts.window  ガントの表示期間
 * @param opts.tpop    ガントの編集の窓({ id, x, y })。なければ出さない
 * @param opts.showPrio / opts.showActual  今日の優先・ガントの実績を出すか(既定は出す)
 */
function renderProjects(data, today, opts = {}) {
  const { view = "gantt", hideDone = false, showPrio = true, showActual = true } = opts;
  const addBtn = `<button class="btn" data-addproject>＋ プロジェクトを追加</button>`;
  if (!data.projects.length) {
    return `<div class="toolbar"><div></div>${addBtn}</div><section class="panel"><p class="muted" style="margin:0">プロジェクトがありません。「＋ プロジェクトを追加」から追加してください。</p></section>`;
  }
  const filter = opts.filter && data.projects.some((p) => p.id === opts.filter) ? opts.filter : "all";
  const ids = filter === "all" ? data.projects.map((p) => p.id) : [filter];
  // チップは、状態が「完了」のプロジェクトを出さない(選択中のあいだだけ出す)。完了のものも、プルダウンから選べる
  const chips = [["all", "すべて"], ...data.projects.filter((p) => p.status !== "完了" || p.id === filter).map((p) => [p.id, p.name])]
    .map(([k, l]) => `<button class="chip-btn" data-filter="${esc(k)}" aria-pressed="${filter === k}">${esc(l)}</button>`).join("");
  const pick = `<label class="pfilter">プロジェクト <select class="in sm" data-projectpick aria-label="プロジェクト名で絞り込み"><option value="all"${filter === "all" ? " selected" : ""}>すべて</option>${data.projects.map((p) => `<option value="${esc(p.id)}"${p.id === filter ? " selected" : ""}>${esc(p.name)}</option>`).join("")}</select></label>`;
